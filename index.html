<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Николай - Мои качества</title>
    <style>
               body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            min-height: 100vh;
            /* ВОТ ЭТА СТРОЧКА — ПУТЬ К КАРТИНКЕ */
            background-image: url('static/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            /* Размытие фона */
            backdrop-filter: blur(8px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-top: 50px;
        }

        .header h1 {
           font-style: italic;
            margin-bottom: 0;
            letter-spacing: 2px;
        }

        .header p {
            font-size:italic;
            color: #e5e5e5;
            margin-top: 10px;
        }

        .grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 50px;
            max-width: 1000px;
        }

        .card {
            width: 250px;
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            background: #222;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: white;
            display: block;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-text {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Николай</h1>
        <p>человек с большим сердцем и золотыми руками</p>
    </div>

    <div class="grid">
        
        <!-- Карточка: умение -->
        <a href="/bravery" class="card">
            <img src="static/bravery.jpg" alt="умение">
            <div class="card-text">хобби</div>
        </a>

        <!-- Карточка: знания -->
        <a href="/wisdom" class="card">
            <img src="static/wisdom.jpg" alt="Мудрость">
            <div class="card-text">сила духа</div>
        </a>

        <!-- Карточка: Сила -->
        <a href="/strength" class="card">
            <img src="static/strength.jpg" alt="Сила">
            <div class="card-text">юность</div>
        </a>

    </div>

</body>
</html>
